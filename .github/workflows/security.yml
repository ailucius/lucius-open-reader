name: security

# Free scanners in place of GitHub's paid Secret Protection and Code Security
# (27 Oct 2026). trufflehog checks each push and pull request, and whether a
# key it finds is live; every night it and gitleaks read the whole history,
# trivy checks the dependencies against new advisories, and zizmor lints these
# workflow files when they change and once a week.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '11 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  trufflehog:
    # A dependency bump cannot add a secret, and Dependabot's token is read-only.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The commits in this push or pull request
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified,unknown
      - name: The whole history (nightly, or by hand)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          base: ""
          head: main
          extra_args: --results=verified,unknown
      - name: What to do
        if: failure()
        run: echo "trufflehog found a live or unverifiable secret. Read the step log, rotate the key first, then clean the history." >> "$GITHUB_STEP_SUMMARY"

  gitleaks-history:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over every commit
        run: >-
          docker run --rm -v "$PWD:/repo" --entrypoint sh zricethezav/gitleaks:v8.30.1
          -c 'git config --global --add safe.directory /repo &&
          gitleaks git /repo --redact --no-banner'

  trivy:
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Known vulnerabilities in the dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  zizmor:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --min-severity medium --format github .github/workflows
